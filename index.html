<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Site em Manutenção</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        .container img {
            max-width: 280px;
            width: 100%;
            height: auto;
            margin-bottom: 20px;
        }

        .message-box {
            background-color: #6a1b9a; /* roxo */
            color: #ffffff;
            padding: 20px 25px;
            border-radius: 8px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .message-box p {
            margin: 0;
            font-size: 18px;
            line-height: 1.5;
        }

        .phone {
            margin-top: 10px;
            font-weight: bold;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="LOGO-ESCURAPrancheta-1.png" alt="Logo da empresa">

        <div class="message-box">
            <p>
                Estamos em manutenção em nosso site.<br>
                Dúvidas, ou conhecer nossos planos?
            </p>
            <p class="phone">
                Entre em contato conosco<br>
                (98) 98193-8908
            </p>
        </div>
    </div>

</body>
</html>
